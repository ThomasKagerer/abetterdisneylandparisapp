# Insert inside weletapi.com's SSL VirtualHost, before its closing tag.
<Directory /mnt/backup/webdav/files/.internal/Disney/>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    DirectoryIndex index.php
    RewriteEngine On
    RewriteRule ^index\.php$ - [END]
    RewriteRule ^$ index.php [END]
    RewriteRule ^(.+)$ index.php?asset=$1 [END,QSA,B]
    Header always unset Permissions-Policy
    Header always set Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), screen-wake-lock=(self), microphone=(), camera=(), payment=()"
    Header always set Cache-Control "private, no-store"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
</Directory>
