# Place INSIDE the actually enabled weletapi.com HTTPS virtual host,
# immediately after RewriteEngine On, before its login rewrite rules.
# On this host sites-enabled/weletapi-ssl.conf is a regular file, NOT a
# symlink to sites-available. Preserve both originals in the SSD backup.
# Shutdown worker removes the old client-side redirect. No old app runs.
RewriteRule ^/files/\.internal/Disney/sw\.js$ - [END]
Alias /files/.internal/Disney/sw.js /mnt/backup/docker-projects/disney-public/migration/sw.js
<Directory /mnt/backup/docker-projects/disney-public/migration/>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    Require method GET HEAD
    AddType application/javascript .js
    Header always set Cache-Control "no-store, max-age=0"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Service-Worker-Allowed "/files/.internal/Disney/"
</Directory>
RewriteRule ^/files/\.internal/Disney(?:/.*)?$ - [G,L]
